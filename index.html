<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tradutor de Anúncios — capte turistas internacionais</title>
<meta name="description" content="Gere versões em inglês e espanhol do seu anúncio de temporada no litoral. Satélite da rede praia.digital">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#eef2ff;color:#1e1b4b;min-height:100vh}
header{padding:24px;text-align:center;background:linear-gradient(120deg,#4338ca,#6366f1);color:#fff}
nav a{color:#fef08a;margin:0 8px;text-decoration:none;font-size:14px}
.wrap{max-width:720px;margin:auto;padding:24px}
.panel{background:#fff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 6px 18px rgba(67,56,202,.12)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input{width:100%;padding:12px;border-radius:10px;border:2px solid #c7d2fe;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{border-radius:12px;padding:16px;margin-top:12px;font-size:15px;line-height:1.6}
.en{background:#eff6ff;border-left:5px solid #3b82f6}.es{background:#fef2f2;border-left:5px solid #ef4444}
button.copy{float:right;background:#4338ca;color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:700}
footer{padding:20px;text-align:center;font-size:13px}
footer a{color:#4338ca}
</style></head>
<body>
<header><h1>🌎 Tradutor de Anúncios</h1><p>Seu imóvel em português, inglês e espanhol — mais reservas internacionais</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/gerador-descricoes">Gerador IA</a><a href="https://praia.digital/seo-anuncio">SEO de Anúncio</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="wrap">
<div class="panel"><h2>📝 Seu imóvel</h2>
<label>Tipo</label><input id="tipo" value="apartamento" oninput="gen()">
<div class="row"><div><label>Quartos</label><input id="q" type="number" value="2" oninput="gen()"></div><div><label>Hóspedes</label><input id="h" type="number" value="5" oninput="gen()"></div></div>
<label>Cidade / bairro</label><input id="loc" value="Santos, Gonzaga" oninput="gen()">
<label>Distância da praia</label><input id="dist" value="a 100m da praia" oninput="gen()">
<label>Diferenciais</label><input id="dif" value="varanda com vista mar, Wi-Fi 500MB, ar-condicionado" oninput="gen()"></div>
<div class="panel"><h2>🇺🇸 English</h2><div class="out en" id="en"></div><button class="copy" onclick="cp('en',this)">📋 Copiar</button></div>
<div class="panel"><h2>🇪🇸 Español</h2><div class="out es" id="es"></div><button class="copy" onclick="cp('es',this)">📋 Copiar</button></div>
</div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/whatsapp-kit">WhatsApp Kit</a> · <a href="https://praia.digital/area-anfitriao">Área do Anfitrião</a> · <a href="https://praia.digital/marea">Maréa</a></footer>
<script>
function g(id){return document.getElementById(id).value}
function gen(){
en.innerHTML=`🏖️ Beautiful ${g('tipo')} in ${g('loc')} — ${g('dist')}!<br><br>✔️ ${g('q')} bedroom(s) · sleeps ${g('h')}<br>✔️ Highlights: ${g('dif')}<br>✔️ Self check-in · fast Wi-Fi · full kitchen<br><br>Perfect for families and remote work by the beach. Book your stay on the Brazilian coast! 🌊`;
es.innerHTML=`🏖️ Hermoso ${g('tipo')} en ${g('loc')} — ¡${g('dist')}!<br><br>✔️ ${g('q')} dormitorio(s) · hasta ${g('h')} huéspedes<br>✔️ Diferenciales: ${g('dif')}<br>✔️ Self check-in · Wi-Fi rápido · cocina completa<br><br>Ideal para familias y trabajo remoto frente al mar. ¡Reserva tu estadía en la costa brasileña! 🌊`;}
function cp(id,btn){navigator.clipboard.writeText(document.getElementById(id).innerText);btn.textContent='✅';setTimeout(()=>btn.textContent='📋 Copiar',1500);}
gen();
</script></body></html>
